---
- name: Install docker
  community.general.pacman: name=docker state=present update_cache=yes

- name: Install docker-compose
  community.general.pacman: name=docker-compose state=present

- name: Install python-docker
  community.general.pacman: name=python-docker state=present

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory

- name: Deploy /etc/docker/daemon.json if not existing
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    force: false

- name: Enable and start docker daemon
  ansible.builtin.service: name=docker enabled=yes state=started
