---
- name: Install common tools
  community.general.pacman:
    name:
      - less
      - htop
      - nethogs
      - procs
      - tldr
      - lsd
      - ripgrep
      - httpie
      - bat
      - fd
      - fzf
      - dua-cli
      - ncdu
      - yazi
      # yazi optional dependencies:
      - ffmpeg
      - poppler
      - zoxide
      - imagemagick
      - xclip
      # ------
      - ranger
      - sd
      - git-delta
      - duf
      - jq
      - yq
    state: present
    update_cache: true

- name: Configure git to use delta
  community.general.git_config:
    name: "{{ item.name }}"
    scope: system
    value: "{{ item.value }}"
  with_items:
    - { name: core.pager, value: delta }
    - { name: interactive.diffFilter, value: 'delta --color-only' }

- name: Configure delta style
  community.general.git_config:
    name: "{{ item.name }}"
    scope: system
    value: "{{ item.value }}"
  with_items:
    - { name: delta.navigate, value: true }
    - { name: delta.line-numbers, value: true }
    - { name: delta.side-by-side, value: true }
